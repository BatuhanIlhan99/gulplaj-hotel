name: Publish Gulplaj Hotel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build gallery from managed content
        run: node scripts/materialize-gallery.mjs
      - name: Build verified guest review section
        run: node scripts/materialize-reviews.mjs
      - name: Build crawlable content and SEO pages
        run: node scripts/build-seo.mjs
      - name: Validate website
        run: node scripts/validate-site.mjs
      - name: Verify admin content and publishing safeguards
        run: node --test scripts/admin.test.mjs
      - name: Verify security protections and public files
        run: node --test scripts/security.test.mjs
      - name: Verify private reporting and consent safeguards
        run: node --test scripts/reporting.test.mjs scripts/reporting-ui.test.mjs
      - name: Verify SEO pages and structured data
        run: node --test scripts/seo.test.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
